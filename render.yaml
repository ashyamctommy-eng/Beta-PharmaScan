# Render Blueprint — PharmaScanKE on the free plan, with the database holding
# everything (documents included), because Render's free filesystem is ephemeral.
#
# 1. Push this repo (or connect it in Render) and pick "New > Blueprint".
# 2. Paste a Neon connection string when asked for DATABASE_URL:
#      postgresql+asyncpg://user:password@host/dbname?ssl=require
#    (Render's own free Postgres expires after 30 days — Neon's does not.)
# 3. Set GROQ_API_KEY (your OpenRouter key), ADMIN_PASSWORD and ACCESS_CODE.
# 4. Test connection in /admin, then generate a summary on a real PDF.
services:
  - type: web
    name: pharmascan
    runtime: docker
    plan: free
    healthCheckPath: /api/notes
    autoDeploy: true
    envVars:
      # Everything lives in the database: no local disk is needed or used.
      - key: STORAGE_BACKEND
        value: database
      - key: DATABASE_URL
        sync: false                     # set in the dashboard (Neon connection string)
      - key: GROQ_API_KEY
        sync: false                     # OpenRouter key: sk-or-v1-...
      - key: GROQ_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_MAP_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_SUMMARY_MODEL
        value: openai/gpt-oss-20b
      - key: ADMIN_USERNAME
        value: Poriotke
      - key: ADMIN_PASSWORD
        sync: false                     # set in the dashboard, never in the repo
      - key: ACCESS_CODE
        sync: false                     # students unlock once per device
      - key: SUMMARISE_DAILY_TOKEN_BUDGET
        value: "150000"
      - key: SUMMARISE_PER_IP_DAILY_TOKENS
        value: "30000"
      # Free database tiers are ~0.5 GB, so keep uploads modest.
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
